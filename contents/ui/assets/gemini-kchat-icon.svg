<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Mrežasti preliv sa tri tačke uticaja -->
    <radialGradient id="eqGradient" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2196F3" />
      <stop offset="100%" stop-color="#0D47A1" />
    </radialGradient>

    <!-- Preliv za crvenu sa vrha -->
    <linearGradient id="topRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53735" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#E53935" stop-opacity="0" />
    </linearGradient>

    <!-- Preliv za žutu sa leve strane -->
    <linearGradient id="leftYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEB3D" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#FFEB3B" stop-opacity="0" />
    </linearGradient>

    <!-- Maskiranje preliva unutar kruga -->
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="200" />
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Osnovni plavi krug -->
    <circle cx="250" cy="250" r="200" fill="url(#eqGradient)" />

    <!-- Žuti sloj s leve strane -->
    <rect x="0" y="0" width="500" height="500" fill="url(#leftYellow)" style="mix-blend-mode: screen;" />

    <!-- Crveni sloj sa vrha -->
    <rect x="0" y="0" width="500" height="500" fill="url(#topRed)" style="mix-blend-mode: screen;" />
  </g>
</svg>
